[General]
# Values here are exposed to QML as `config.<Key>`. Everything arrives as a
# STRING -- `config.SomeFlag === "true"`, never `if (config.SomeFlag)`, because
# the string "false" is truthy in JavaScript.
#
# THIS FILE IS THE ROOT-OWNED DEFAULTS. Do not put the live palette here.
# SDDM also reads `theme.conf.user` next to this file and layers it on top,
# overriding matching keys. That is where the wallpaper-derived palette lands,
# written by ~/.config/mango/scripts/sddm-palette-sync.sh on each wallpaper
# change. Keeping the two separate is what lets the palette be user-writable
# while the theme's code stays root-owned -- see that script's header comment.
#
# So: the colours below are the FALLBACK shown before the palette has ever
# synced (fresh install, or a machine where the sync never ran). They are a
# complete, usable dark theme on their own -- Components/Palette.qml also
# carries the same values, so a missing or corrupt theme.conf.user degrades
# gracefully instead of rendering a broken login screen.

BackgroundColor=#15121c
SurfaceColor=#1e1b26
SurfaceHighColor=#211e28
TextColor=#e7e0ee
SubTextColor=#cbc4d2
AccentColor=#d2bcff
OnAccentColor=#3d008f
OutlineColor=#948e9c
ErrorColor=#ffb4ab
ScrimColor=#000000

# Show real names ("Chris") instead of usernames ("chris") in the user picker.
UseRealName=false
