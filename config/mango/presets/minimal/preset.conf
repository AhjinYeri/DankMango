# preset: minimal
# label: Minimal
# icon: compress
# blurb: Tight gaps and quick animations — more screen, less motion.
#
# =============================================================================
#  DankMango preset  --  "Minimal"
# =============================================================================
#  DO NOT DELETE THE FOUR "# key: value" LINES AT THE TOP -- see the same note
#  in ../default/preset.conf for what each one is read by.
#
#  WHAT THIS PRESET DOES
#    * Shrinks the gaps between windows and along the left/right screen edges
#      (20-28px -> 6px), so windows sit close together and you get noticeably
#      more usable screen. The TOP/BOTTOM edge gap stays larger on purpose --
#      see "WHY gappov IS NOT 6" below. That is not an oversight.
#    * Shortens every window animation, so opening, closing and switching feel
#      immediate rather than animated. Nothing is switched OFF -- the animations
#      still run, they just finish quickly.
#
#  Switching back to "Default" undoes all of it. Nothing here is written into
#  config.conf, so there is nothing to clean up by hand.
#
# -----------------------------------------------------------------------------
#  ONE THING TO KNOW BEFORE YOU USE THIS  (read ../README.md for the full story)
# -----------------------------------------------------------------------------
#  The four gap settings below are ALSO written by DankMaterialShell, into
#  ~/.config/mango/dms/layout.conf, whenever you move the gaps slider in
#  DMS Settings -> Compositor Layout. config.conf sources this preset AFTER that
#  file, and mango's last-definition-wins rule means THIS FILE WINS.
#
#  Plain English: while "Minimal" is active, the DMS gaps slider does nothing.
#  That is intended -- picking a preset is a deliberate choice and should beat an
#  ambient slider -- but it looks exactly like a broken slider if you don't know.
#  Two ways out, both fine:
#    * switch back to Default (the slider works again immediately), or
#    * delete the four gapp* lines below to let this preset be animations-only.
#
#  Animation settings have no such conflict: DMS never writes them.
#
# -----------------------------------------------------------------------------
#  WHY gappov IS NOT 6  (the taskbar-clipping fix -- do not "tidy" this to 6)
# -----------------------------------------------------------------------------
#  Short version: the DankMaterialShell bar can RESERVE less space than it
#  actually covers, and gappov is what makes up the difference. Set it too low
#  and the bottom edge of every tiled window -- border and all -- is drawn
#  underneath the bar.
#
#  The mechanism, measured on DMS 1.5.3 / mango 0.16.0:
#    * The bar is a layer surface. mango keeps tiled windows out of its
#      EXCLUSIVE ZONE, then applies gappov inside what is left.
#    * DMS sets that zone in Modules/DankBar/DankBarWindow.qml:
#          exclusiveZone = barThickness + spacing + bottomGap      (line 764)
#          visual height = barThickness + spacing                  (line 663)
#      so when the bar's "Gap" setting (bottomGap) is NEGATIVE -- a popular
#      tweak, it tucks the bar closer to the screen edge -- the bar COVERS
#      (-bottomGap) more pixels than it RESERVES. mango is not doing anything
#      wrong; it is honouring the smaller number DMS asked for.
#
#  So the rule is simply:
#          gappov  >=  -bottomGap        (when bottomGap is negative)
#
#  Worked example from the machine this was found on: bottomGap = -15, bar
#  thickness+spacing = 47, exclusive zone = 32. On a 1440px-tall screen a tiled
#  window's bottom edge lands at 1440 - 32 - gappov, and the bar's visible top
#  edge is at 1393:
#          gappov = 6   ->  bottom edge 1402  ->  9px BEHIND the bar   (clipped)
#          gappov = 18  ->  bottom edge 1390  ->  3px clear of the bar (fixed)
#
#  18 = 15 to clear the bar + 3 for the window border, so the border is still
#  visible rather than just touching. DMS's own default bottomGap is 0, so on an
#  untweaked bar anything down to 0 would be safe -- 18 is chosen to also cover
#  the common negative settings, and post-update-health.sh checks the rule
#  against YOUR actual bar config and tells you if you need more.
#
#  The 15 does NOT change with any display or font setting, and that is worth
#  knowing before you go hunting for a scale-aware version of this number:
#    * bar thickness (DankBarWindow.qml:563/565) is
#          widgetThickness = max(20, 26 + innerPadding*0.6)
#          thickness       = max(widgetThickness + innerPadding + 4,
#                                48 - 4 - (8 - innerPadding))
#      -- driven by the bar's INNER PADDING and SPACING only. Theme.barHeight is
#      a hardcoded 48 and font/icon scale do not enter into it at all, so there
#      is no scale-aware version of this number to go looking for.
#    * both of those terms appear in the exclusive zone AND in the visual height,
#      so they cancel. Whatever you do to the bar's size, the overhang stays
#      exactly (-bottomGap).
#  Verified by measurement at two different bar thicknesses (inner padding 8 and
#  16 -> bar 47px and 59px, exclusive zone 32 and 44): the overhang stayed 15px
#  and the clearance stayed 3px in both. The same test with gappov back at 6 was
#  clipped by 9px at BOTH sizes, which is the deficit this value removes.
#
#  gappoh (left/right) is untouched at 6: nothing reserves space at the sides.
# =============================================================================

# --- Gaps ---------------------------------------------------------------------
# gappih/gappiv = INNER gaps (between windows), horizontal / vertical.
# gappoh/gappov = OUTER gaps (window to screen edge), horizontal / vertical.
gappih = 6
gappiv = 6
gappoh = 6
# NOT 6 -- must stay >= the bar's negative "Gap" setting. See the box above.
gappov = 18

# --- Animation timing ---------------------------------------------------------
# Milliseconds. These are the same four knobs config.conf sets; only the
# durations change here, so the animation CURVES from config.conf still apply.
animation_duration_open = 80
animation_duration_close = 80
animation_duration_move = 120
animation_duration_tag = 120
