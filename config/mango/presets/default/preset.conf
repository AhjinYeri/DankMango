# preset: default
# label: Default
# icon: home
# blurb: DankMango out of the box. Adds nothing on top of your own settings.
#
# =============================================================================
#  DankMango preset  --  "Default"
# =============================================================================
#  DO NOT DELETE THE FOUR "# key: value" LINES AT THE TOP. They are not
#  decoration -- set-preset.sh and the Presets launcher plugin read them:
#      preset:  must match this folder's name (set-preset.sh refuses the switch
#               if it doesn't -- that mismatch is how a copy-pasted preset ends
#               up applying under the wrong name)
#      label:   the name shown for this preset in the launcher
#      icon:    a Material Symbol name, decorative only (the label is the truth)
#      blurb:   the one line of description under the label
#
#  WHAT THIS PRESET DOES: nothing at all, deliberately.
#
#  "Default" is the baseline -- your desktop exactly as config.conf and your DMS
#  settings describe it. It is an EMPTY fragment on purpose rather than a copy of
#  the baseline values, and that distinction matters: a copy would freeze today's
#  numbers into this file and then quietly override the DMS Settings sliders
#  forever (see the precedence note in ../README.md). An empty fragment can't.
#
#  So "switch back to Default" is also the fix for "a preset is overriding a
#  setting I want to change in DMS Settings". That only works while this file
#  stays empty -- if you want your own baseline tweaks, make your own preset
#  folder next to this one instead of editing this file.
# =============================================================================

# (intentionally no settings below this line)
