# Intentionally EMPTY -- declares no binds, and must stay that way.
#
# config.conf does NOT source this file any more (see the block where the
# "source = ./dms/binds.conf" line used to be, near the bottom of config.conf).
# DankMango declares every bind in config.conf itself, each with a full-line
# description comment above it.
#
# This file is still shipped, and install.sh still deploys it to
# ~/.config/mango/dms/binds.conf, for exactly one reason: it OVERWRITES whatever
# DMS last regenerated there. `dms keybinds set`, `dms keybinds remove` and
# `dms setup binds` all rewrite that path with ~90 stock DMS binds. Shipping an
# empty file means an install or update run puts the harmless version back.
#
# Do not add binds here. A bind in this file is invisible to config.conf's
# ordering rules and, if the source line is ever restored, would be parsed AFTER
# every DankMango bind -- mango is first-wins, so it would silently lose to them
# anyway while still colliding in `mango --check`-style conflict warnings.
#
# Note also that DMS writes this file in its own format, "bind=...,spawn,<cmd> #
# <description>". mango does NOT strip trailing comments (parse_config.h only skips
# lines whose FIRST character is '#'), and spawn arguments go through wordexp(),
# which does not treat '#' as a comment either. A trailing comment therefore becomes
# extra argv on the spawned command. That is why DankMango's own convention is a
# full-line comment ABOVE the bind, never a trailing one.
